services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qr_ordering
    ports:
      - "5433:5432"
    volumes:
      - qr_ordering_pgdata:/var/lib/postgresql/data

volumes:
  qr_ordering_pgdata:
